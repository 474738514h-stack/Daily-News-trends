    .bubble.user.side-left .bubble-text { border-radius: 4px 14px 14px 14px; }
    .bubble.user.side-right .bubble-text { border-radius: 14px 4px 14px 14px; }
    .debate-compose {
      display: flex; flex-direction: row; flex-wrap: nowrap;
      gap: .45rem; align-items: center; margin-top: 1.05rem;
      padding-top: 0; border-top: none;
    }
    .debate-compose[hidden] { display: none !important; }
    .debate-compose input {
      flex: 1 1 auto; min-width: 0; border: 1px solid var(--line); border-radius: 10px;
      padding: .6rem .8rem; font: inherit; font-size: .98rem; background: #fff; color: var(--ink);
    }
    .debate-compose input:focus { outline: none; border-color: #111; box-shadow: 0 0 0 3px rgba(0,0,0,.06); }
    .debate-compose button {
      flex: 0 0 auto; margin-left: auto; border: 1px solid #111; background: #111; color: #fff;
      border-radius: 10px; padding: .5rem .95rem; font: inherit; font-size: .95rem; font-weight: 400;
      cursor: pointer; min-height: 2.45rem; white-space: nowrap;
    }
    .debate-compose button:hover { background: #333; }
    .debate-compose button:disabled { opacity: .55; cursor: default; }
    .debate-compose input:disabled { opacity: .65; cursor: default; background: #f7f7f7; }
    .bubble.typing .bubble-text {
      display: inline-flex; align-items: center; gap: .28rem;
      min-width: 3.2rem; padding: .78rem 1rem;
    }
    .bubble.typing .dot {
      width: .42rem; height: .42rem; border-radius: 999px; background: #8a8a8a;
      opacity: .35; animation: debate-dot 1.05s ease-in-out infinite;
    }
    .bubble.typing .dot:nth-child(2) { animation-delay: .18s; }
    .bubble.typing .dot:nth-child(3) { animation-delay: .36s; }
    @keyframes debate-dot {
      0%, 80%, 100% { opacity: .28; transform: translateY(0); }
      40% { opacity: .95; transform: translateY(-2px); }
    }
    @media (max-width: 767px) {
      .actions-btns { flex-wrap: wrap; gap: .5rem .65rem; }
      .actions-btns > .action-link { flex: 0 0 100%; font-size: .86rem; padding: .1rem 0; }
      .actions-btns > .deep-btn { flex: 1 1 calc(50% - .35rem); font-size: .86rem; padding: .48rem .55rem; white-space: normal; }
      .bubble-text { font-size: .95rem; padding: .68rem .88rem; }
      .debate-compose { flex-wrap: nowrap; }
      .debate-compose input { font-size: 16px; }
      .debate-compose button { width: auto; margin-left: auto; }
    }

    /* Toast */
    .toast {
      position: fixed; left: 50%; bottom: calc(1.4rem + var(--safe-bottom));
      transform: translateX(-50%) translateY(12px);
      z-index: 100; padding: .55rem 1rem; border-radius: 999px;
      background: #111; color: #fff; font-size: .95rem; font-weight: 400;
      box-shadow: var(--shadow); opacity: 0; pointer-events: none;
      transition: opacity .2s ease, transform .22s ease;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .field-input:focus { outline: none; border-color: #111; box-shadow: 0 0 0 3px rgba(0,0,0,.06); }
    .icon-btn { transition: background .15s ease, border-color .15s ease; }

    function typewriterAsync(el, fullText, s) {
      return new Promise((resolve) => {
        if (!el) { resolve(false); return; }
        const text = String(fullText || "");
        el.textContent = "";
        let i = 0;
        const tick = () => {
          if (!s || s.aborted) { resolve(false); return; }
          if (i >= text.length) {
            el.textContent = text;
            resolve(true);
            return;
          }
          // Always 1 code point — never batch multi-char jumps (felt "instant")
          const cp = text.codePointAt(i);
          const step = cp > 0xffff ? 2 : 1;
          el.textContent += text.slice(i, i + step);

      if (last.classList.contains("con") || last.classList.contains("side-right")) return "right";

    async function pumpDebateStream(key) {

        if (!okThink || s.aborted || s.gen !== gen || debateStream[key] !== s) return;
        if (!openDebate.has(key)) { stopDebateStream(key); return; }
        // Step B: one empty bubble → typewriter (never dump the queue)

        if (arr.length) arr[arr.length - 1] = { role, text: String(next.text || "") };

        if (s.queue.length) {

    function startPasserbyStream(key, turns) {

      const queue = (turns || []).map((r) => ({

        text: String(r.text || "")

      if (!queue.length) return;

      if (alreadyOpen) {

    /** Soft-reload at next 08:00 Asia/Shanghai (or when crawl updates HTML via /__mtime). */
    (function scheduleShanghaiMorningReload() {
      function shanghaiParts(d) {
        const parts = new Intl.DateTimeFormat("en-GB", {
          timeZone: FEED_TZ,

          hour: "2-digit", minute: "2-digit", second: "2-digit",

      function msUntilNext0800() {
        const p = shanghaiParts();
        const since = ((p.h * 60 + p.mi) * 60 + p.se) * 1000;
        const target = FEED_REFRESH_HOUR * 3600 * 1000;
        let wait = target - since;
        if (wait < 1500) wait += 24 * 3600 * 1000;
        return wait;
      }
      function softReload() {
        if (window.__morningFeedStreamActive) {
          setTimeout(softReload, 12000);
          return;
        }
        location.reload();
      }
      function arm() {
        setTimeout(() => { softReload(); }, msUntilNext0800());
      }
      arm();
    })();

          if (String(m) !== String(last)) {
            // Never reload mid group-chat stream — kills timers and makes
            // the next paint look like an instant dump of queued replies.
            if (window.__morningFeedStreamActive) return;
            last = m;
            location.reload();
          }
        })
        .catch(function () {
          fails += 1;
        })
        .finally(function () {
          setTimeout(tick, fails > 5 ? 4000 : 1200);
        });
    }
    setTimeout(tick, 800);
  })();
  </script>
</body>
</html>
